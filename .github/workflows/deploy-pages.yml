# Deploys the static sites to GitHub Pages:
#   /       → apps/web   (the EcoPrompt web app)
#   /demo/  → apps/demo  (extension test playground)
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify vendored core is in sync
        run: npm test

      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp -r apps/web/* _site/
          cp -r apps/demo/* _site/demo/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
