<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Gradient background circle for depth -->
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e8f5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a5d6a7;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>

  <!-- Main leaf shape -->
  <path d="M 64 30 Q 90 50 92 80 Q 92 90 86 95 Q 80 100 70 98 Q 60 96 54 90 L 64 30 Z"
        fill="url(#leafGradient)"
        stroke="#2e7d32"
        stroke-width="2"/>

  <!-- Left side of leaf -->
  <path d="M 64 30 Q 38 50 36 80 Q 36 90 42 95 Q 48 100 58 98 Q 60 96 64 90 L 64 30 Z"
        fill="url(#leafGradient)"
        stroke="#2e7d32"
        stroke-width="2"/>

  <!-- Leaf vein (center line) -->
  <line x1="64" y1="30" x2="64" y2="95" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Side veins -->
  <line x1="64" y1="45" x2="48" y2="55" stroke="#2e7d32" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="45" x2="80" y2="55" stroke="#2e7d32" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="60" x2="46" y2="70" stroke="#2e7d32" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="60" x2="82" y2="70" stroke="#2e7d32" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="75" x2="48" y2="85" stroke="#2e7d32" stroke-width="1.5" opacity="0.7"/>
  <line x1="64" y1="75" x2="80" y2="85" stroke="#2e7d32" stroke-width="1.5" opacity="0.7"/>

  <!-- Small highlight for depth -->
  <ellipse cx="58" cy="50" rx="12" ry="8" fill="white" opacity="0.3"/>
</svg>
